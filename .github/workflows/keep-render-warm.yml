name: Keep Werk warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://werk-rou3.onrender.com/api/health
