services:
  - type: web
    name: werk
    plan: free
    runtime: node
    buildCommand: npm run build && npm --prefix server ci && npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MARKETPLACE_PROVIDER_ENABLED
        value: "true"
      - key: MARKETPLACE_TOKEN_SECRET
        sync: false
      - key: MARKETPLACE_MAX_CONCURRENT
        value: "1"
      - key: MARKETPLACE_RATE_LIMIT_MAX
        value: "4"
      # Matches the live dashboard. Keep in step: a redeploy from this
      # blueprint overwrites the dashboard value and would silently
      # switch the x402 paywall off.
      - key: OKX_PAYMENT_ENABLED
        value: "true"
      - key: OKX_PAYMENT_RECIPIENT
        sync: false
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: OKX_PAYMENT_PRICE_USDT0
        value: "1"
